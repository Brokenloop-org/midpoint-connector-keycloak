name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'maven'
      - name: Build and run unit tests
        run: mvn -B test

  integration-tests:
    name: Integration tests against Keycloak ${{ matrix.kc-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kc-version: ['26.5.7', '26.8.1']
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'maven'
      # A service container cannot take a command, and the Keycloak image
      # exits after printing its help without one. Start it the way
      # docker-compose.yml does.
      - name: Start Keycloak
        run: |
          docker run -d --name keycloak -p 8090:8080 -p 9000:9000 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            quay.io/keycloak/keycloak:${{ matrix.kc-version }} \
            start-dev --health-enabled=true --features=organization
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:9000/health/ready > /dev/null && exit 0
            sleep 2
          done
          echo "Keycloak did not become ready"
          docker logs keycloak
          exit 1
      - name: Run integration tests
        run: mvn -B verify -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dassembly.skipAssembly=true -Dkeycloak.url=http://localhost:8090
      - name: Upload failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-${{ matrix.kc-version }}
          path: target/failsafe-reports/
