name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'maven'
      - name: Build and run unit tests
        run: mvn -B test

  integration-tests:
    name: Integration tests against Keycloak ${{ matrix.kc-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kc-version: ['26.5.7']
    services:
      keycloak:
        image: quay.io/keycloak/keycloak:${{ matrix.kc-version }}
        env:
          KC_BOOTSTRAP_ADMIN_USERNAME: admin
          KC_BOOTSTRAP_ADMIN_PASSWORD: admin
        ports:
          - 8090:8080
        # KC service-container needs custom command; use options to set it.
        options: >-
          --health-cmd "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'maven'
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8090/realms/master > /dev/null && exit 0
            sleep 2
          done
          echo "Keycloak did not become ready"
          exit 1
      - name: Run integration tests
        run: mvn -B verify -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dassembly.skipAssembly=true -Dkeycloak.url=http://localhost:8090
      - name: Upload failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-${{ matrix.kc-version }}
          path: target/failsafe-reports/
